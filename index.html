<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>早教规划在线工具</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="topbar">
  <div class="brand">
    <span class="brand-icon">👶</span>
    <span class="brand-text">早教规划</span>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="schedule">📋 课程表</button>
    <button class="nav-tab" data-view="issues">❓ 问题清单</button>
    <button class="nav-tab" data-view="settings">⚙️ 设置</button>
  </div>
  <div class="nav-right">
    <button id="adminToggle" class="btn-icon" title="管理员模式">🔒</button>
    <button id="exportBtn" class="btn-icon" title="导出数据">📤</button>
  </div>
</nav>

<!-- 管理员登录弹窗 -->
<div id="adminLoginModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>管理员登录</h2>
    <p class="modal-desc">输入密码进入管理员模式，可编辑所有内容</p>
    <input type="password" id="adminPassword" placeholder="请输入管理员密码" class="input-field">
    <p id="adminError" class="error-text"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAdminLogin()">取消</button>
      <button class="btn btn-primary" onclick="tryAdminLogin()">登录</button>
    </div>
    <p class="modal-hint">默认密码：admin123（可在设置中修改）</p>
  </div>
</div>

<!-- 主内容区 -->
<main id="appMain" class="main-content">

  <!-- 课程表视图 -->
  <section id="view-schedule" class="view active">
    <div class="view-header">
      <h1>📚 早教课程表</h1>
      <p class="view-desc">18个月女宝 · 8个月主题课程 · 六大维度全面发展</p>
    </div>

    <!-- 月份导航 -->
    <div class="month-nav" id="monthNav"></div>

    <!-- 月份内容 -->
    <div id="monthContent"></div>
  </section>

  <!-- 问题清单视图 -->
  <section id="view-issues" class="view">
    <div class="view-header">
      <h1>❓ 待解决问题清单</h1>
      <p class="view-desc">记录和追踪早教规划中的待办事项和问题</p>
    </div>

    <div class="issues-toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">全部 <span id="countAll">0</span></button>
        <button class="filter-tab" data-filter="open">待解决 <span id="countOpen">0</span></button>
        <button class="filter-tab" data-filter="resolved">已解决 <span id="countResolved">0</span></button>
      </div>
      <button class="btn btn-primary" id="addIssueBtn">➕ 添加问题</button>
    </div>

    <div id="issuesList" class="issues-list"></div>
  </section>

  <!-- 设置视图 -->
  <section id="view-settings" class="view">
    <div class="view-header">
      <h1>⚙️ 设置</h1>
      <p class="view-desc">管理数据、样式和云端同步</p>
    </div>

    <div class="settings-sections">
      <!-- 数据管理 -->
      <div class="settings-card">
        <h3>💾 数据管理</h3>
        <div class="settings-row">
          <label>导出数据</label>
          <button class="btn btn-secondary" onclick="exportData()">导出 JSON</button>
        </div>
        <div class="settings-row">
          <label>导入数据</label>
          <input type="file" id="importFile" accept=".json" class="file-input">
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">选择文件</button>
        </div>
        <div class="settings-row">
          <label>重置数据</label>
          <button class="btn btn-danger" onclick="resetData()">恢复默认数据</button>
        </div>
      </div>

      <!-- 样式设置 -->
      <div class="settings-card">
        <h3>🎨 样式设置</h3>
        <div class="settings-row">
          <label>主题色</label>
          <input type="color" id="themeColor" value="#FF6B35" onchange="updateTheme()">
        </div>
        <div class="settings-row">
          <label>字体大小</label>
          <select id="fontSize" onchange="updateFontSize()">
            <option value="14">小</option>
            <option value="16" selected>中</option>
            <option value="18">大</option>
          </select>
        </div>
        <div class="settings-row">
          <label>表格圆角</label>
          <input type="range" id="borderRadius" min="0" max="20" value="12" onchange="updateBorderRadius()">
          <span id="radiusValue">12px</span>
        </div>
      </div>

      <!-- 云端同步 -->
      <div class="settings-card">
        <h3>☁️ 云端同步</h3>
        <p class="settings-desc">配置云端 API 地址后，管理员修改的数据将同步到云端，所有访问者均可看到最新内容。</p>
        <div class="settings-row">
          <label>API 地址</label>
          <input type="text" id="syncUrl" placeholder="https://your-api.vercel.app/api" class="input-field">
          <button class="btn btn-secondary" onclick="saveSyncUrl()">保存</button>
        </div>
        <div class="settings-row">
          <label>同步状态</label>
          <span id="syncStatus" class="sync-badge">未配置</span>
          <button class="btn btn-secondary" onclick="syncToCloud()" id="syncBtn">立即同步</button>
        </div>
      </div>

      <!-- 管理员设置 -->
      <div class="settings-card">
        <h3>🔐 管理员设置</h3>
        <div class="settings-row">
          <label>修改密码</label>
          <input type="password" id="newAdminPassword" placeholder="新密码" class="input-field">
          <button class="btn btn-secondary" onclick="changeAdminPassword()">修改</button>
        </div>
        <div class="settings-row">
          <label>管理员状态</label>
          <span id="adminStatus" class="sync-badge">未登录</span>
        </div>
      </div>

      <!-- 部署信息 -->
      <div class="settings-card">
        <h3>🚀 部署信息</h3>
        <div class="settings-row">
          <label>应用版本</label>
          <span>v1.0.0</span>
        </div>
        <div class="settings-row">
          <label>数据存储</label>
          <span id="storageInfo">本地存储</span>
        </div>
        <div class="settings-row">
          <label>访问统计</label>
          <span id="visitCount">0 次访问</span>
        </div>
      </div>
    </div>
  </section>

</main>

<!-- 添加问题弹窗 -->
<div id="issueModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2 id="issueModalTitle">添加问题</h2>
    <div class="form-group">
      <label>标题</label>
      <input type="text" id="issueTitle" placeholder="简要描述问题" class="input-field">
    </div>
    <div class="form-group">
      <label>详情</label>
      <textarea id="issueDetail" placeholder="详细描述（可选）" class="textarea-field" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label>优先级</label>
      <select id="issuePriority" class="input-field">
        <option value="high">🔴 高</option>
        <option value="medium" selected>🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </div>
    <div class="form-group">
      <label>分类</label>
      <select id="issueCategory" class="input-field">
        <option value="content">内容问题</option>
        <option value="style">样式问题</option>
        <option value="function">功能需求</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeIssueModal()">取消</button>
      <button class="btn btn-primary" onclick="saveIssue()">保存</button>
    </div>
  </div>
</div>

<!-- 编辑单元格弹窗 -->
<div id="cellEditModal" class="modal-overlay" style="display:none;">
  <div class="modal">
    <h2>编辑内容</h2>
    <div class="form-group">
      <label id="cellEditLabel">内容</label>
      <textarea id="cellEditValue" class="textarea-field" rows="4"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCellEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveCellEdit()">保存</button>
    </div>
  </div>
</div>

<!-- Toast 通知 -->
<div id="toast" class="toast"></div>

<script src="app.js?v=4"></script>
</body>
</html>
